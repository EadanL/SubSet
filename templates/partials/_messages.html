{% comment %}
  Toast stack. Also the target for out-of-band updates: a fragment response can
  include this partial with oob=True to replace it.
{% endcomment %}
<div id="messages" aria-live="polite"{% if oob %} hx-swap-oob="true"{% endif %}
     class="pointer-events-none fixed inset-x-0 top-3 z-40 flex flex-col items-center gap-2 px-5">
  {% for message in messages %}
    <div x-data="{ show: true }"
         x-init="setTimeout(() => show = false, 4000)"
         x-show="show"
         role="status"
         class="pointer-events-auto flex w-full max-w-md items-center gap-3 border bg-surface py-2 pr-2 pl-4 shadow-sm {% if message.level_tag == 'error' %}border-danger text-danger{% else %}border-hairline text-ink{% endif %}">
      <p class="flex-1">{{ message }}</p>
      <button type="button" x-on:click="show = false"
              class="inline-flex min-h-11 cursor-pointer items-center rounded-full px-3 text-meta font-medium text-slate hover:bg-hairline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-court">
        Dismiss
      </button>
    </div>
  {% endfor %}
</div>
