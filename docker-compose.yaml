services:
    db:
        image: postgres:15-alpine
        container_name: subset_postgres_db
        env_file:
            - .env
        environment:
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data/
        ports:
            - '${POSTGRES_PORT}:5432'

volumes:
    postgres_data:
